plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kenowong.carcare'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.kenowong.carcare"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 4
        versionName "2.0-offline"
    }

    signingConfigs {
        release {
            storeFile file('../carcare-release.keystore')
            storePassword 'carcare123'
            keyAlias 'carcare'
            keyPassword 'carcare123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
